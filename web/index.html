<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0e1116; --panel:#161b22; --panel-2:#1b212b; --line:#2a323d;
    --fg:#e9e7e1; --muted:#8a94a2; --faint:#5b6572;
    --wait:#f4b545; --work:#54d08a; --crit:#ef6f6f;
    --radius:14px;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#171d26,transparent 60%),var(--bg);
    color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

  .vitals{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));
    border-bottom:1px solid var(--line);background:linear-gradient(#1a212b,#161b22)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .mark{width:13px;height:13px;border-radius:4px;background:var(--wait);box-shadow:0 0 14px #f4b54588}
  .brand small{color:var(--faint);font:500 11px var(--mono);letter-spacing:.14em}
  .vitals .spacer{flex:1}
  .stat{display:flex;align-items:center;gap:6px;color:var(--muted);font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
  .stat .k{color:var(--faint)}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.g{background:var(--work);box-shadow:0 0 8px #54d08a99}
  .dot.a{background:var(--wait);box-shadow:0 0 8px #f4b54599}
  .dot.r{background:var(--crit)} .dot.x{background:var(--faint)}

  main{flex:1;min-height:0;padding:16px max(16px,env(safe-area-inset-left)) 16px max(16px,env(safe-area-inset-right));overflow:auto}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-content:start;max-width:1180px;margin:0 auto}
  .empty{color:var(--faint);font:500 14px var(--mono);text-align:center;padding:60px 0}

  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;display:flex;flex-direction:column;gap:9px;min-width:0}
  .card.sel{outline:2px solid #ffffff22;outline-offset:2px}
  .card.needs_you{grid-column:1/-1;background:linear-gradient(180deg,#221a0b,#1b212b 46%);
    border-color:#f4b54577;box-shadow:0 0 0 1px #f4b54533,0 0 30px -10px #f4b54566}
  .row{display:flex;align-items:center;gap:8px;min-width:0}
  .repo{font:600 14px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .branch{font:500 11px var(--mono);color:var(--muted);background:#0e1218;border:1px solid var(--line);padding:2px 6px;border-radius:6px;flex:none}
  .spacer{flex:1}
  .pill{font:600 10.5px var(--mono);letter-spacing:.07em;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap}
  .pill.needs_you{color:#1a130a;background:var(--wait)}
  .pill.working{color:var(--work);background:#54d08a1c;border:1px solid #54d08a44}
  .pill.done{color:var(--work);background:#54d08a1c;border:1px solid #54d08a44}
  .pill.idle{color:var(--faint);background:#ffffff0a;border:1px solid var(--line)}
  .pill.ended{color:var(--crit);background:#ef6f6f14;border:1px solid #ef6f6f33}
  .name{font:500 12.5px var(--sans);color:var(--fg)}
  .line{font:400 12.5px/1.45 var(--sans);color:var(--muted);min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .foot{display:flex;align-items:center;gap:9px;color:var(--faint);font:500 11px var(--mono);font-variant-numeric:tabular-nums}
  .kind{text-transform:lowercase}

  .reply{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .reply input[type=text]{flex:1;min-width:140px;background:#0f141b;border:1px solid var(--line);border-radius:9px;
    color:var(--fg);font:500 12.5px var(--mono);padding:8px 10px}
  .reply input::placeholder{color:var(--faint)}
  .btn{font:600 12px var(--mono);padding:8px 11px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f141b;color:var(--fg);display:inline-flex;gap:7px;align-items:center}
  .btn:hover{border-color:#ffffff33}
  .btn.send{border-color:#f4b54566;background:#f4b5450d;color:var(--wait)}
  .btn.yes{border-color:#54d08a55;background:#54d08a14;color:#c7f3da}
  .btn.no{border-color:#ef6f6f55;background:#ef6f6f14;color:#f6cccc}
  .btn.icon{padding:8px 10px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .reply-only-bg{color:var(--faint);font:500 11px var(--mono)}

  .legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:9px max(16px,env(safe-area-inset-left));border-top:1px solid var(--line);background:#12171e;
    font:500 11px var(--mono);color:var(--faint)}
  .legend .key{color:var(--fg);background:#0e1218;border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:5px}
  .legend .spacer{flex:1}
  .toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:#0f141b;border:1px solid var(--line);
    color:var(--fg);font:500 12.5px var(--mono);padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="vitals">
    <div class="brand"><span class="mark"></span>Claude Companion <small>BRIDGE</small></div>
    <div class="spacer"></div>
    <div class="stat"><span class="k">sessions</span> <span id="c-total">0</span></div>
    <div class="stat"><span class="dot a"></span><span id="c-wait">0</span> waiting</div>
    <div class="stat"><span class="dot g"></span><span id="c-work">0</span> working</div>
    <div class="stat"><span class="k">link</span><span id="link-dot" class="dot x"></span><span id="link-txt">…</span></div>
    <div class="stat" id="clock">--:--</div>
  </div>

  <main><div class="grid" id="grid"><div class="empty">connecting to bridge…</div></div></main>

  <div class="legend">
    <span><span class="key">⏎</span>send reply</span>
    <span><span class="key">Y</span>/<span class="key">N</span> approve top</span>
    <span><span class="key">📷</span>attach image</span>
    <span class="spacer"></span>
    <span id="updated">—</span>
  </div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept="image/*" hidden>

<script>
  const TOKEN = (function(){
    const injected = "__COMPANION_TOKEN__";
    if (injected && injected.indexOf("__COMPANION") === -1) return injected;
    return new URLSearchParams(location.search).get("token") || "";
  })();
  const grid = document.getElementById("grid");
  const toastEl = document.getElementById("toast");
  const fileInput = document.getElementById("file");
  let state = { sessions: [], counts: {} };
  let selected = null;        // sessionId
  let pendingImageFor = null; // sessionId awaiting a file pick

  const PILL = {needs_you:"WAITING FOR YOU", working:"WORKING", done:"DONE", idle:"IDLE", ended:"ENDED"};
  const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ago = ms => { if(!ms) return ""; const s=Math.max(0,(Date.now()-ms)/1000);
    if(s<60) return Math.floor(s)+"s"; if(s<3600) return Math.floor(s/60)+"m"; return Math.floor(s/3600)+"h"; };

  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("on"); clearTimeout(toast._t);
    toast._t=setTimeout(()=>toastEl.classList.remove("on"),1800); }

  async function api(path, opts){
    opts = opts||{}; opts.headers = Object.assign({Authorization:"Bearer "+TOKEN}, opts.headers||{});
    const r = await fetch(path, opts); if(!r.ok) throw new Error(r.status); return r.json();
  }

  async function reply(sid, text){
    if(!text.trim()) return;
    try{ await api("/api/reply",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sessionId:sid,text})}); toast("reply queued → "+text.slice(0,40)); }
    catch(e){ toast("reply failed ("+e.message+")"); }
  }

  function card(s){
    const canReply = s.kind === "background";
    const needs = s.state === "needs_you";
    const el = document.createElement("div");
    el.className = "card " + s.state + (selected===s.sessionId?" sel":"");
    el.dataset.sid = s.sessionId;
    el.innerHTML = `
      <div class="row">
        <span class="repo" title="${esc(s.cwd)}">${esc(s.repo || s.cwd || "session")}</span>
        ${s.branch?`<span class="branch">${esc(s.branch)}</span>`:""}
        <span class="spacer"></span>
        <span class="pill ${s.state}">${needs?'<span class="dot r"></span>':''}${PILL[s.state]||s.state}</span>
      </div>
      ${s.name?`<div class="name">${esc(s.name)}</div>`:""}
      ${s.line?`<div class="line">${esc(s.line)}</div>`:""}
      <div class="foot"><span class="kind">${esc(s.kind||"session")}</span>
        <span>·</span><span>${esc(s.id||"")}</span>
        <span class="spacer"></span><span>${ago(s.lastEventAt)}</span></div>`;
    const bar = document.createElement("div");
    bar.className = "reply";
    if(canReply){
      if(needs){
        bar.innerHTML = `
          <button class="btn yes" data-reply="yes">Yes</button>
          <button class="btn no" data-reply="no">No</button>
          <input type="text" placeholder="type a reply… (⏎)">
          <button class="btn send" data-send>Send</button>
          <button class="btn icon" data-img title="attach a photo">📷</button>`;
      } else {
        bar.innerHTML = `
          <input type="text" placeholder="send to this session…">
          <button class="btn send" data-send>Send</button>
          <button class="btn icon" data-img title="attach a photo">📷</button>`;
      }
    } else {
      bar.innerHTML = `<span class="reply-only-bg">interactive session — read-only (start it with <code>claude --bg</code> to reply)</span>`;
    }
    el.appendChild(bar);

    el.addEventListener("click", () => { selected = s.sessionId; render(); });
    const input = bar.querySelector("input[type=text]");
    const doSend = () => { if(input){ reply(s.sessionId, input.value); input.value=""; } };
    bar.querySelectorAll("[data-reply]").forEach(b =>
      b.addEventListener("click", e => { e.stopPropagation(); reply(s.sessionId, b.dataset.reply); }));
    const sendBtn = bar.querySelector("[data-send]");
    if(sendBtn) sendBtn.addEventListener("click", e => { e.stopPropagation(); doSend(); });
    if(input) input.addEventListener("keydown", e => { if(e.key==="Enter"){ e.stopPropagation(); doSend(); } });
    const imgBtn = bar.querySelector("[data-img]");
    if(imgBtn) imgBtn.addEventListener("click", e => { e.stopPropagation(); pendingImageFor=s.sessionId; fileInput.click(); });
    return el;
  }

  function render(){
    const c = state.counts||{};
    document.getElementById("c-total").textContent = (state.sessions||[]).length;
    document.getElementById("c-wait").textContent = c.needs_you||0;
    document.getElementById("c-work").textContent = c.working||0;
    grid.innerHTML = "";
    if(!state.sessions || !state.sessions.length){
      grid.innerHTML = `<div class="empty">no sessions yet — start one with <code>claude --bg "…"</code></div>`;
      return;
    }
    state.sessions.forEach(s => grid.appendChild(card(s)));
  }

  fileInput.addEventListener("change", async () => {
    const f = fileInput.files[0]; if(!f || !pendingImageFor) return;
    try{
      await fetch("/api/uploads/image?sessionId="+encodeURIComponent(pendingImageFor),
        {method:"POST", headers:{Authorization:"Bearer "+TOKEN,"Content-Type":f.type}, body:f});
      toast("image sent to Claude");
    }catch(e){ toast("image upload failed"); }
    fileInput.value=""; pendingImageFor=null;
  });

  // keyboard: Y/N approve the top waiting session, ⏎ focuses its input
  document.addEventListener("keydown", e => {
    if(e.target.tagName === "INPUT") return;
    const top = (state.sessions||[]).find(s => s.state==="needs_you" && s.kind==="background");
    if(!top) return;
    if(e.key.toLowerCase()==="y"){ reply(top.sessionId,"yes"); }
    else if(e.key.toLowerCase()==="n"){ reply(top.sessionId,"no"); }
    else if(e.key==="Enter"){ const i=grid.querySelector('.card.needs_you input[type=text]'); if(i) i.focus(); }
  });

  function connect(){
    const dot=document.getElementById("link-dot"), txt=document.getElementById("link-txt");
    const es = new EventSource("/events?token="+encodeURIComponent(TOKEN));
    es.onopen = () => { dot.className="dot g"; txt.textContent="live"; };
    es.onerror = () => { dot.className="dot r"; txt.textContent="reconnecting"; };
    es.onmessage = ev => {
      try{ const msg=JSON.parse(ev.data); if(msg.type==="snapshot"){ state=msg; render();
        document.getElementById("updated").textContent="updated "+new Date().toLocaleTimeString(); } }catch(_){}
    };
  }
  setInterval(()=>{ document.getElementById("clock").textContent =
    new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }, 1000);
  connect();
</script>
</body>
</html>
